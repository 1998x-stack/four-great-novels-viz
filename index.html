<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>四大名著 · 人物关系图谱</title><link rel="stylesheet" href="assets/style.css"><script defer src="assets/app.js"></script></head>
<body><header><div class="brand"><span class="seal">四</span><div><small>FOUR GREAT NOVELS / KNOWLEDGE GRAPH</small><h1>四大名著 · 人物关系图谱</h1></div></div><a class="repo" href="https://github.com/1998x-stack/four-great-novels-viz">GitHub 数据仓库 ↗</a></header>
<main><nav id="books" aria-label="书籍"></nav><section class="intro"><div><div class="eyebrow">章回知识库 / <span id="edition">—</span></div><h2 id="bookTitle">红楼梦</h2><p id="bookNote">按章回探索人物、关系与故事原文。</p></div><div id="stats" class="stats"></div></section>
<div class="toolbar"><label>章回<select id="chapter" aria-label="章回"></select></label><label>关系类别<select id="category"><option value="">全部类别</option></select></label><label>视图<select id="scope"><option value="1">一度关系</option><option value="2">二度关系</option><option value="all">全局</option></select></label><label>证据<select id="evidence"><option value="">全部证据</option><option value="reviewed">人工核验</option><option value="anchored_paragraph">段落定位</option><option value="keyword_match">关键词定位</option><option value="chapter_only">章回定位</option></select></label><span id="status" role="status" aria-live="polite"></span></div>
<section class="workspace"><aside class="panel people"><div class="panelhead"><h3>人物名录</h3><span id="personCount"></span></div><input id="search" type="search" placeholder="姓名 / 别名 / ID" aria-label="搜索人物"><div id="peopleList" class="scroll"></div></aside>
<section class="panel graph"><div class="panelhead"><h3 id="graphTitle">关系图谱</h3><div class="controls"><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="reset">复位</button></div></div><div class="canvas"><svg id="graph" viewBox="0 0 900 620" role="group" aria-label="人物关系交互图"></svg></div><div class="legend" id="legend"></div><p class="tip">点击节点查看人物，点击连线或关系列表查看故事。拖动画布空白处可平移；使用 ＋/− 缩放。</p></section>
<aside class="panel detail"><div class="panelhead"><h3>人物与故事</h3><button id="timeline">章回事件</button></div><div id="detail" class="scroll" aria-live="polite"></div></aside></section>
<footer>数据状态：整理草稿，尚未全部校勘。关键词匹配不等同于人工核验。<a href="data/catalog.json">数据目录</a> · <a href="https://github.com/1998x-stack/four-great-novels-viz/blob/main/CONTRIBUTING.md">录入指南</a></footer></main></body></html>
